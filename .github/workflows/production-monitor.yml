name: Production website monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

concurrency:
  group: production-website-monitor
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  MONITOR_URL: https://lkbio.net
  MONITOR_ATTEMPTS: "3"
  MONITOR_ARTIFACT_DIR: monitor-artifacts

jobs:
  monitor:
    name: Check lkbio.net in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "Chrome executable was not found on the runner." >&2
            exit 1
          fi
          echo "path=$chrome_path" >> "$GITHUB_OUTPUT"

      - name: Run user-facing production check
        id: monitor
        continue-on-error: true
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node .github/scripts/check-production.mjs

      - name: Upload failure evidence
        if: steps.monitor.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lkbio-production-monitor-${{ github.run_id }}
          path: monitor-artifacts/
          retention-days: 14

      - name: Create or update incident issue
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- lkbio-production-monitor -->';
            const title = '[자동 장애 감지] lkbio.net 사용자 관점 점검 실패';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const checkedAt = new Date().toISOString();
            const mention = '@wonjerry';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'bug,type:ops,troubleshooting',
              per_page: 100,
            });
            const incident = issues.find((issue) =>
              !issue.pull_request && issue.body?.includes(marker),
            );

            const details = [
              mention,
              '',
              `운영 사이트 자동 점검이 3회 연속 실패했습니다.`,
              '',
              `- 대상: ${process.env.MONITOR_URL}`,
              `- 확인 시각: ${checkedAt}`,
              `- 실행 로그 및 스크린샷: ${runUrl}`,
              '',
              'Cloudflare Registrar/DNS 상태와 최근 배포를 우선 확인해 주세요.',
            ].join('\n');

            if (incident) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: incident.number,
                body: `### 장애 재감지\n\n${details}`,
              });
              core.notice(`기존 장애 이슈 #${incident.number}에 재감지 내용을 추가했습니다.`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body: `${marker}\n${details}`,
                labels: ['bug', 'type:ops', 'troubleshooting'],
              });
              core.notice(`장애 이슈 #${created.data.number}를 생성했습니다.`);
            }

      - name: Close recovered incident
        if: steps.monitor.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- lkbio-production-monitor -->';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'bug,type:ops,troubleshooting',
              per_page: 100,
            });
            const incidents = issues.filter((issue) =>
              !issue.pull_request && issue.body?.includes(marker),
            );

            for (const incident of incidents) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: incident.number,
                body: [
                  '### 자동 복구 확인',
                  '',
                  `운영 사이트가 다시 사용자 관점 점검을 통과했습니다.`,
                  `- 대상: ${process.env.MONITOR_URL}`,
                  `- 확인 시각: ${new Date().toISOString()}`,
                  `- 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: incident.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail workflow when production check failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1
